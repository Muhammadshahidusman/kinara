[project]
name = "kinara"
version = "0.1.0"
description = "Kinara: Ravi Floodplain Watch. Flood exposure and new-construction monitoring for PDMA and district administration, Lahore."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Muhammad Shahid Usman" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "rasterio>=1.4",
    "earthengine-api>=1.4",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# API server: uv sync --extra api
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "reportlab>=4.2",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
]

[dependency-groups]
# installed by default with `uv sync`
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]
# interactive exploration only: uv sync --group explore
explore = [
    "geemap>=0.35",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinara"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
